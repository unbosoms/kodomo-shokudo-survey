<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こども食堂アンケート - 管理画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <div class="container">
        <div id="loading" class="d-flex justify-content-center align-items-center vh-100">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Admin Authentication -->
        <div id="admin-auth" class="mt-4 d-none">
            <h2 class="mb-4">管理者認証</h2>
            <div class="alert alert-info">
                このページは管理者専用です。管理者として認証されていない場合はアクセスできません。
            </div>
            <div id="auth-message"></div>
        </div>

        <!-- Admin Panel -->
        <div id="admin-panel" class="mt-4 d-none">
            <h2 class="mb-4">管理画面</h2>
            
            <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="shokudo-tab" data-bs-toggle="tab" data-bs-target="#shokudo" type="button" role="tab" aria-controls="shokudo" aria-selected="true">こども食堂管理</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="question-tab" data-bs-toggle="tab" data-bs-target="#question" type="button" role="tab" aria-controls="question" aria-selected="false">質問設定</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="color-tab" data-bs-toggle="tab" data-bs-target="#color" type="button" role="tab" aria-controls="color" aria-selected="false">色設定</button>
                </li>
            </ul>
            
            <div class="tab-content" id="adminTabContent">
                <!-- こども食堂管理 -->
                <div class="tab-pane fade show active" id="shokudo" role="tabpanel" aria-labelledby="shokudo-tab">
                    <h3 class="mb-3">こども食堂登録</h3>
                    <form id="shokudo-form">
                        <div class="mb-3">
                            <label for="shokudoName" class="form-label">こども食堂名</label>
                            <input type="text" class="form-control" id="shokudoName" name="shokudoName" required>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">住所</label>
                            <input type="text" class="form-control" id="address" name="address">
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="latitude" class="form-label">緯度</label>
                                <input type="text" class="form-control" id="latitude" name="latitude">
                            </div>
                            <div class="col">
                                <label for="longitude" class="form-label">経度</label>
                                <input type="text" class="form-control" id="longitude" name="longitude">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">登録する</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <h3 class="mb-3">こども食堂一覧</h3>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名前</th>
                                    <th>住所</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="shokudo-list">
                                <!-- Will be populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- 質問設定 -->
                <div class="tab-pane fade" id="question" role="tabpanel" aria-labelledby="question-tab">
                    <h3 class="mb-3">質問と回答設定</h3>
                    <form id="question-form">
                        <div class="mb-3">
                            <label for="questionShokudoId" class="form-label">こども食堂</label>
                            <select class="form-select" id="questionShokudoId" name="questionShokudoId" required>
                                <option value="" selected disabled>選択してください</option>
                                <!-- Will be populated dynamically -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="questionText" class="form-label">質問文</label>
                            <input type="text" class="form-control" id="questionText" name="questionText" required>
                        </div>
                        <div class="card mb-3">
                            <div class="card-header">回答選択肢（各象限に割り当てる回答）</div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label for="quadrantUL" class="form-label">左上</label>
                                        <input type="text" class="form-control" id="quadrantUL" name="quadrantUL" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="quadrantUR" class="form-label">右上</label>
                                        <input type="text" class="form-control" id="quadrantUR" name="quadrantUR" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <label for="quadrantLL" class="form-label">左下</label>
                                        <input type="text" class="form-control" id="quadrantLL" name="quadrantLL" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="quadrantLR" class="form-label">右下</label>
                                        <input type="text" class="form-control" id="quadrantLR" name="quadrantLR" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">設定を保存</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <h3 class="mb-3">現在の設定</h3>
                    <div class="mb-3">
                        <label for="currentQuestionShokudoId" class="form-label">こども食堂</label>
                        <select class="form-select" id="currentQuestionShokudoId">
                            <option value="" selected disabled>選択してください</option>
                            <!-- Will be populated dynamically -->
                        </select>
                    </div>
                    <div id="current-question-settings" class="d-none">
                        <div class="card">
                            <div class="card-header">質問設定</div>
                            <div class="card-body">
                                <h5 class="card-title" id="current-question-text"></h5>
                                <div class="row">
                                    <div class="col-6 text-center border-end border-bottom p-2">
                                        <div id="current-quadrant-ul"></div>
                                    </div>
                                    <div class="col-6 text-center border-bottom p-2">
                                        <div id="current-quadrant-ur"></div>
                                    </div>
                                    <div class="col-6 text-center border-end p-2">
                                        <div id="current-quadrant-ll"></div>
                                    </div>
                                    <div class="col-6 text-center p-2">
                                        <div id="current-quadrant-lr"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 色設定 -->
                <div class="tab-pane fade" id="color" role="tabpanel" aria-labelledby="color-tab">
                    <h3 class="mb-3">色の意味設定</h3>
                    <form id="color-form">
                        <div class="mb-3">
                            <label for="colorShokudoId" class="form-label">こども食堂</label>
                            <select class="form-select" id="colorShokudoId" name="colorShokudoId" required>
                                <option value="" selected disabled>選択してください</option>
                                <!-- Will be populated dynamically -->
                            </select>
                        </div>
                        <div class="card mb-3">
                            <div class="card-header">シールの色が表す属性</div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label for="colorRed" class="form-label">
                                            <span class="badge bg-danger">赤</span>
                                        </label>
                                        <input type="text" class="form-control" id="colorRed" name="colorRed" placeholder="例: 未就学児" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="colorGreen" class="form-label">
                                            <span class="badge bg-success">緑</span>
                                        </label>
                                        <input type="text" class="form-control" id="colorGreen" name="colorGreen" placeholder="例: 小学生" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-6">
                                        <label for="colorBlue" class="form-label">
                                            <span class="badge bg-primary">青</span>
                                        </label>
                                        <input type="text" class="form-control" id="colorBlue" name="colorBlue" placeholder="例: 中高生" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="colorYellow" class="form-label">
                                            <span class="badge bg-warning">黄</span>
                                        </label>
                                        <input type="text" class="form-control" id="colorYellow" name="colorYellow" placeholder="例: 大人" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">設定を保存</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <h3 class="mb-3">現在の設定</h3>
                    <div class="mb-3">
                        <label for="currentColorShokudoId" class="form-label">こども食堂</label>
                        <select class="form-select" id="currentColorShokudoId">
                            <option value="" selected disabled>選択してください</option>
                            <!-- Will be populated dynamically -->
                        </select>
                    </div>
                    <div id="current-color-settings" class="d-none">
                        <div class="card">
                            <div class="card-header">色設定</div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-3 text-center">
                                        <span class="badge bg-danger">赤</span>
                                        <div id="current-color-red"></div>
                                    </div>
                                    <div class="col-3 text-center">
                                        <span class="badge bg-success">緑</span>
                                        <div id="current-color-green"></div>
                                    </div>
                                    <div class="col-3 text-center">
                                        <span class="badge bg-primary">青</span>
                                        <div id="current-color-blue"></div>
                                    </div>
                                    <div class="col-3 text-center">
                                        <span class="badge bg-warning">黄</span>
                                        <div id="current-color-yellow"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Debug JS (for troubleshooting) -->
    <script src="/static/js/debug.js"></script>
    <!-- Admin JS -->
    <script src="/static/js/liff.js"></script>
    <script src="/static/js/admin.js"></script>
    
    <!-- Pass LIFF ID to JavaScript -->
    <script>
        const liffId = "{{ liff_id }}";
    </script>
</body>
</html>
