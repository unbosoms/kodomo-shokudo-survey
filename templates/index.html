<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こども食堂アンケート</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <div class="container">
        <div id="loading" class="d-flex justify-content-center align-items-center vh-100">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- User Registration Form -->
        <div id="registration-form" class="mt-4 d-none">
            <h2 class="mb-4">ユーザー登録</h2>
            <form id="user-form">
                <input type="hidden" id="userId" name="userId">
                
                <div class="mb-3">
                    <label for="displayName" class="form-label">お名前</label>
                    <input type="text" class="form-control" id="displayName" name="displayName" readonly>
                </div>
                
                <div class="mb-3">
                    <label for="shokudoId" class="form-label">こども食堂</label>
                    <select class="form-select" id="shokudoId" name="shokudoId" required>
                        <option value="" selected disabled>選択してください</option>
                        <!-- Will be populated dynamically -->
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">登録する</button>
            </form>
        </div>

        <!-- Main App -->
        <div id="main-app" class="mt-4 d-none">
            <h2 class="mb-4">こども食堂アンケート</h2>
            
            <div class="mb-3">
                <div class="card">
                    <div class="card-header">
                        <span id="shokudo-name"></span>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" id="question-text"></h5>
                        <div class="row">
                            <div class="col-6 text-center border-end border-bottom p-2">
                                <div id="quadrant-ul"></div>
                            </div>
                            <div class="col-6 text-center border-bottom p-2">
                                <div id="quadrant-ur"></div>
                            </div>
                            <div class="col-6 text-center border-end p-2">
                                <div id="quadrant-ll"></div>
                            </div>
                            <div class="col-6 text-center p-2">
                                <div id="quadrant-lr"></div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <div class="row">
                                <div class="col-3 text-center">
                                    <span class="badge bg-danger">赤</span>
                                    <div id="color-red"></div>
                                </div>
                                <div class="col-3 text-center">
                                    <span class="badge bg-success">緑</span>
                                    <div id="color-green"></div>
                                </div>
                                <div class="col-3 text-center">
                                    <span class="badge bg-primary">青</span>
                                    <div id="color-blue"></div>
                                </div>
                                <div class="col-3 text-center">
                                    <span class="badge bg-warning">黄</span>
                                    <div id="color-yellow"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="camera-container mb-3">
                <div class="position-relative">
                    <video id="camera" class="w-100" autoplay playsinline></video>
                    <img id="guide-overlay" class="position-absolute top-0 start-0 w-100 h-100" style="pointer-events: none;">
                    <canvas id="canvas" class="d-none"></canvas>
                </div>
                
                <div class="mt-2 d-flex justify-content-between">
                    <button id="start-camera" class="btn btn-primary">カメラを起動</button>
                    <button id="take-photo" class="btn btn-success d-none">写真を撮る</button>
                    <button id="retake-photo" class="btn btn-secondary d-none">撮り直す</button>
                    <button id="upload-photo" class="btn btn-danger d-none">送信する</button>
                </div>
            </div>
            
            <div id="result-container" class="mt-4 d-none">
                <div class="card">
                    <div class="card-header">集計結果</div>
                    <div class="card-body">
                        <div id="result-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Debug JS (for troubleshooting) -->
    <script src="/static/js/debug.js"></script>
    <!-- App JS -->
    <script src="/static/js/liff.js"></script>
    <script src="/static/js/camera.js"></script>
    <script src="/static/js/app.js"></script>
    
    <!-- Pass LIFF ID to JavaScript -->
    <script>
        const liffId = "{{ liff_id }}";
    </script>
</body>
</html>
